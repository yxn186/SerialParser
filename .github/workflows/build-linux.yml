name: Build Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    env:
      QT_VERSION: "6.11.0"
      QT_INSTALL_DIR: "${{ github.workspace }}/Qt"
      QT_PREFIX: "${{ github.workspace }}/Qt/6.11.0/gcc_64"
      BUILD_DIR: "build_linux"
      OUTPUT_NAME: "SerialParser-Linux-x86_64.AppImage"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3-pip \
            wget \
            file \
            patchelf \
            libfuse2 \
            libgl1-mesa-dev \
            libfontconfig1 \
            libfreetype6 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-randr0 \
            libxcb-shape0 \
            libxcb-xkb1

      - name: Install Qt
        run: |
          python3 -m pip install --user aqtinstall
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$QT_INSTALL_DIR" -m qtcharts qtserialport

      - name: Build
        run: |
          chmod +x scripts/build_linux.sh scripts/deploy_linux_appimage.sh
          ./scripts/build_linux.sh

      - name: Download linuxdeployqt
        run: |
          wget -O linuxdeployqt-continuous-x86_64.AppImage https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      - name: Package AppImage
        run: |
          ./scripts/deploy_linux_appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialParser-Linux-x86_64
          path: SerialParser-Linux-x86_64.AppImage

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "SerialParser release"

          gh release upload "$GITHUB_REF_NAME" SerialParser-Linux-x86_64.AppImage --clobber
